# esta configuracion se usa SOLO cuando corro los tests, nunca cuando la app real levanta con docker
# (docker usa su propio application.properties de produccion, con la base de datos real en un archivo)
# aca uso una base h2 que vive en memoria y se borra sola al terminar, para no depender de nada externo
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop